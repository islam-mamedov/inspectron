name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate benchmark manifest provenance
        run: |
          python benchmarks/scripts/validate_dataset.py \
            --manifest benchmarks/manifests/site_safety_real.json \
            --metadata-only
          python benchmarks/scripts/validate_dataset.py \
            --manifest benchmarks/manifests/site_safety_real.example.json \
            --metadata-only

      - name: Run simulated mission
        run: |
          python -m inspectron.cli > /tmp/inspectron-demo.json
          python -m json.tool /tmp/inspectron-demo.json > /dev/null

      - name: Build package
        run: python -m build

  cpp-safety:
    name: C++ safety supervisor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure C++ safety supervisor
        run: |
          cmake \
            -S cpp \
            -B build/cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSPECTRON_WARNINGS_AS_ERRORS=ON

      - name: Build C++ safety supervisor
        run: cmake --build build/cpp --config Release --parallel 2

      - name: Run C++ safety tests
        run: |
          ctest \
            --test-dir build/cpp \
            --build-config Release \
            --output-on-failure

  ros2-safety:
    name: ROS 2 perception, mission, and control stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: ros:jazzy-ros-base

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ROS 2 test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-jazzy-ament-cmake-gtest \
            ros-jazzy-ament-cmake-pytest \
            ros-jazzy-launch-testing-ament-cmake

      - name: Build and test ROS 2 perception, mission, and control stack
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash

          mkdir -p /tmp/inspectron_ros_ws
          cd /tmp/inspectron_ros_ws

          colcon build \
            --base-paths "${GITHUB_WORKSPACE}/ros2" \
            --packages-up-to \
              inspectron_motion_controller \
              inspectron_perception_bridge \
              inspectron_mission_orchestrator \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DINSPECTRON_ROS_WARNINGS_AS_ERRORS=ON

          colcon test \
            --base-paths "${GITHUB_WORKSPACE}/ros2" \
            --packages-select \
              inspectron_safety_supervisor \
              inspectron_motion_controller \
              inspectron_perception_bridge \
              inspectron_mission_orchestrator \
            --event-handlers console_direct+

          colcon test-result --verbose
