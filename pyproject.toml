[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectron"
version = "0.1.0"
description = "Embodied VLM agent for structural inspection"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
inspectron-demo = "inspectron.cli:main"
inspectron-vlm = "inspectron.vlm_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]